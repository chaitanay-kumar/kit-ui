name: Registry CI

on:
  push:
    branches: [main, feat/kit-ui-library]
  pull_request:
    branches: [main, feat/kit-ui-library]

jobs:
  validate:
    name: Validate Registry, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate and validate registry
        run: npm run component:sync

      - name: Verify generated Angular catalog and exports
        run: |
          npm run angular:sync
          if [ -n "$(git status --porcelain -- packages/angular/src packages/angular/catalog.json packages/angular-demo/src/ports.ts src/lib/framework/angular-ports.ts)" ]; then
            git status --short -- packages/angular/src packages/angular/catalog.json packages/angular-demo/src/ports.ts src/lib/framework/angular-ports.ts
            git diff -- packages/angular/src packages/angular/catalog.json packages/angular-demo/src/ports.ts src/lib/framework/angular-ports.ts
            echo "::error::Angular generated files are out of sync. Run npm run angular:sync and commit its outputs."
            exit 1
          fi

      - name: Verify generated registry files are committed and in sync
        run: |
          git diff --exit-code registry.json src/components/registry/components-data.ts src/components/registry/catalog-index.ts public/source || (
            echo "::error::Generated registry files are out of sync with source files. Run 'npm run component:sync' locally and commit the changes." && exit 1
          )

      - name: Run linter
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npx tsc -b

      - name: Run tests
        run: npm run test

      - name: Run build
        run: npm run build

      - name: Verify Activity Feed package contract
        run: npm run test:activity-feed
      - name: Verify Data Table package contract
        run: npm run test:data-table
      - name: Verify Agent Activity package contract
        run: npm run test:agent-activity
      - name: Verify Prompt Composer package contract
        run: npm run test:prompt-composer
      - name: Verify Loader package contract
        run: npm run test:loader
      - name: Verify Press Button
        run: npm run test:press-button
      - name: Verify Typewriter Button
        run: npm run test:typewriter-button
      - name: Verify Expandable Search
        run: npm run test:expandable-search
      - name: Verify Button contract
        run: npm run test:button
      - name: Verify Hamburger Menu packaged contract
        run: npm run test:hamburger-menu
      - name: Verify Magnetic Button contract
        run: npm run test:magnetic-button
      - name: Verify Neon Edge Button contract
        run: npm run test:neon-edge-button
      - name: Verify Orbital Loading Ring contract
        run: npm run test:orbital-loading-ring
      - name: Verify native Reveal Card contract
        run: npm run test:reveal-card
      - name: Verify native Spotlight Card contract
        run: npm run test:spotlight-card
      - name: Verify native Morphing Icon contract
        run: npm run test:morphing-icon
      - name: Verify native Morphing Button contract
        run: npm run test:morphing-button

      - name: Verify Rainbow Button contract
        run: npm run test:rainbow-button

      - name: Verify Smooth Accordion contract
        run: npm run test:smooth-accordion
      - name: Verify Stretch Switch contract
        run: npm run test:stretch-switch

      - name: Verify Angular package in a separate consumer
        run: npm run test:angular-package
      - name: Verify audited native callback defaults and failures
        run: node scripts/verify-integration-callbacks.mjs
      - name: Verify iOS Search Bar controlled contract
        run: npm run test:ios-search
      - name: Verify UnfoldAccordion and Animated Number contracts
        run: npm run test:parity-batch4
